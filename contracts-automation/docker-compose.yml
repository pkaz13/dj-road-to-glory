services:
  contracts-automation-api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    image: contracts-automation-api
    container_name: contracts-automation-api
    ports:
      - "5050:5050"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5050
    networks:
      - default

  contracts-automation-web:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    image: contracts-automation-web
    container_name: contracts-automation-web
    ports:
      - "5173:80"
    depends_on:
      - contracts-automation-api
    networks:
      - default

networks:
  default:
    driver: bridge
