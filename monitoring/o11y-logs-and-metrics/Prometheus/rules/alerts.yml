groups:
  - name: http-alerts
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job) / sum(rate(http_server_requests_seconds_count[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate detected (>5%)"
          description: "More than 5% of HTTP requests are returning 5xx errors for job {{ $labels.job }}."
      - alert: DrasticIncreaseInHttpRequests
        expr: increase(http_server_requests_seconds_count[5m]) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Drastic increase in HTTP requests"
          description: "More than 1000 HTTP requests in the last 5 minutes for job {{ $labels.job }}." 