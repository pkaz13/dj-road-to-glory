auth_enabled: false
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info
  http_server_read_timeout: 5m
  http_server_write_timeout: 5m
  http_server_idle_timeout: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  storage:
    path: /var/tempo/metrics

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http: