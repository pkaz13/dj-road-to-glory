services:
  # ASP.NET Core API
  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: products-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5050:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - database-network
      - cache-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microsoft SQL Server (simplified)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: products-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD_FILE=/run/secrets/db_password
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - database-network
    secrets:
      - db_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$(cat /run/secrets/db_password)\" -Q 'SELECT 1' -C"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis Cache (unchanged)
  redis:
    image: redis:8-alpine
    container_name: products-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cache-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Network configuration (unchanged)
networks:
  api-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  
  database-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  
  cache-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/24

# Persistent volumes (unchanged)
volumes:
  sqlserver-data:
    driver: local
  redis-data:
    driver: local

# Secrets management (unchanged)
secrets:
  db_password:
    file: ./secrets/db_password.txt
